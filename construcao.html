<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página em Construção</title>
    <link rel="icon" type="image/png" href="./imgStyle/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&display=swap" rel="stylesheet"/>
    <style>
      body {
        background: linear-gradient(135deg, #f7f3fa 0%, #fff 100%);
        min-height: 100vh;
        margin: 0;
        font-family: "Calistoga", serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .construcao-container {
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(106, 76, 147, 0.1);
        padding: 48px 32px 40px 32px;
        text-align: center;
        max-width: 400px;
      }
      .construcao-icone {
        font-size: 4em;
        color: #ffca3a;
        margin-bottom: 16px;
        animation: balanco 1.2s infinite alternate;
      }
      @keyframes balanco {
        0% {
          transform: rotate(-8deg);
        }
        100% {
          transform: rotate(8deg);
        }
      }
      .construcao-titulo {
        color: #6a4c93;
        font-size: 2.2em;
        margin-bottom: 12px;
      }
      .construcao-texto {
        color: #444;
        font-size: 1.15em;
        margin-bottom: 24px;
      }
      .construcao-voltar {
        display: inline-block;
        background: #6a4c93;
        color: #fff;
        padding: 12px 32px;
        border-radius: 20px;
        text-decoration: none;
        font-size: 1.1em;
        transition: background 0.2s;
      }
      .construcao-voltar:hover {
        background: #ffca3a;
        color: #6a4c93;
      }
    </style>
  </head>
  <body>
    <div class="construcao-container">
      <div class="construcao-icone">🚧</div>
      <div class="construcao-titulo">Página em construção</div>
      <div class="construcao-texto">
        Estamos preparando novidades para você.<br />
        Volte em breve para conferir!
      </div>
      <a href="paginaPrincipal.php" class="construcao-voltar">Voltar ao site</a>
    </div>
  </body>
</html>
